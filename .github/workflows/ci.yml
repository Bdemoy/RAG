name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydocagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mydocagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mydocagent_test

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          working-directory: backend

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -v
